[project]
name = "jatayu"
version = "0.1.0"
description = "Agentic vision-language assistant for remote-sensing imagery"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.8",
    "streamlit>=1.62.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jatayu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["gpu: needs a GPU (skipped in CI)"]
